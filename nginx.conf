events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # 只处理 /admin
        location /admin {
            index index.html;
            try_files $uri /admin/index.html;
        }
    }
}
