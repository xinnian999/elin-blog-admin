events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # 将 server 指令放在 http 块内
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index index.html;
        }
    }
}